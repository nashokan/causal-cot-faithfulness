# Per-model generation settings.
#
# Sampling values are each model's own published recommendations. A single
# shared temperature across four models disadvantages whichever ones were
# tuned differently, and Qwen's thinking mode in particular has its own
# documented settings.
#
# max_new_tokens is the field that decides whether this experiment works.
# A thinking model needs room to finish reasoning AND emit the answer.
# Truncation is indistinguishable from disobedience in the raw metrics,
# which is exactly what went wrong at 1000 tokens in the first attempt.

llama3b:
  hf_id: meta-llama/Llama-3.2-3B-Instruct
  temperature: 0.6
  top_p: 0.9
  top_k: 50
  max_new_tokens: 1024
  max_model_len: 4096
  tensor_parallel_size: 1
  thinking: false

# BLOCKED on Kaggle T4: vLLM refuses float16 for gemma2 (numerical
# instability), T4 has no bfloat16, and float32 does not fit in 2x16GB.
# Left here so the run log records the failure explicitly.
gemma9b:
  hf_id: google/gemma-2-9b-it
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_new_tokens: 1024
  max_model_len: 4096       # gemma-2 caps at 8192; 4096 is ample here
  tensor_parallel_size: 2   # 9B in fp16 does not fit one 16GB T4
  thinking: false

qwen4b:
  hf_id: Qwen/Qwen3-4B-Thinking-2507
  temperature: 0.6          # Qwen's published thinking-mode settings
  top_p: 0.95
  top_k: 20
  # 12288 was set defensively against the known 1024-token truncation failure,
  # but max_model_len caps concurrency: vLLM reserves that much KV cache per
  # request, so a 14336 window gave only 8.4x concurrency and the run took
  # 80 minutes for 200 questions. 6144 restores batching. Watch truncated_rate;
  # if it is non-trivial, raise this and accept the slower run.
  max_new_tokens: 6144
  max_model_len: 6656
  tensor_parallel_size: 1   # 4B fp16 fits one T4; T4s have no P2P, so
                            # tensor parallelism was pure PCIe overhead
  gpu_memory_utilization: 0.93
  thinking: true

deepseek8b:
  hf_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  temperature: 0.6          # DeepSeek's recommended range
  top_p: 0.95
  top_k: 50
  max_new_tokens: 4096      # measured mean was 641 tokens; 8192 was generous
  max_model_len: 4608       # smaller window -> higher concurrency
  tensor_parallel_size: 2   # 8B fp16 needs both T4s
  gpu_memory_utilization: 0.93
  thinking: true
