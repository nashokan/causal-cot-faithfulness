# Per-model generation settings.
#
# Sampling values are each model's own published recommendations. A single
# shared temperature across four models disadvantages whichever ones were
# tuned differently, and Qwen's thinking mode in particular has its own
# documented settings.
#
# max_new_tokens is the field that decides whether this experiment works.
# A thinking model needs room to finish reasoning AND emit the answer.
# Truncation is indistinguishable from disobedience in the raw metrics,
# which is exactly what went wrong at 1000 tokens in the first attempt.

llama3b:
  hf_id: meta-llama/Llama-3.2-3B-Instruct
  temperature: 0.6
  top_p: 0.9
  top_k: 50
  max_new_tokens: 1024
  max_model_len: 4096
  tensor_parallel_size: 1
  thinking: false

gemma9b:
  hf_id: google/gemma-2-9b-it
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_new_tokens: 1024
  max_model_len: 4096       # gemma-2 caps at 8192; 4096 is ample here
  tensor_parallel_size: 2   # 9B in fp16 does not fit one 16GB T4
  thinking: false

qwen4b:
  hf_id: Qwen/Qwen3-4B-Thinking-2507
  temperature: 0.6          # Qwen's published thinking-mode settings
  top_p: 0.95
  top_k: 20
  max_new_tokens: 12288     # thinking-only model; 1024 truncates it every time
  max_model_len: 14336
  tensor_parallel_size: 2
  thinking: true

deepseek8b:
  hf_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  temperature: 0.6          # DeepSeek's recommended range
  top_p: 0.95
  top_k: 50
  max_new_tokens: 8192
  max_model_len: 10240
  tensor_parallel_size: 2
  thinking: true
